name: api-security-lab

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: security_lab
      POSTGRES_USER: lab_user
      POSTGRES_PASSWORD: lab_password
    ports:
      - "127.0.0.1:15436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_user -d security_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: